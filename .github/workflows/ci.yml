name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The golden vectors must always be exactly what the browser extension's
      # own code produces. Regenerate and fail if the committed file is stale.
      - name: Golden vectors are up to date
        run: |
          node tools/gen-vectors/gen-vectors.mjs
          git diff --exit-code -- core-lik31/src/test/resources/golden-vectors.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :core-lik31:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lik31-debug-apk
          path: app/build/outputs/apk/debug/*.apk
